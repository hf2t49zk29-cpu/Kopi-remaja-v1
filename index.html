<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kopi Remaja – Prototipe V1</title>
<style>
:root{--bg:#faf5ef;--sf:#fff;--tx:#2c1b10;--mu:#7a6555;--ac:#8a4b22;--ac2:#f1e3d3;--bd:#e5d6c5;--ok:#2f7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d140e;--sf:#2a1e15;--tx:#f3e8dc;--mu:#b9a593;--ac:#e0985f;--ac2:#3a2a1e;--bd:#4a3829;--ok:#6cc58d}}
:root[data-theme="dark"]{--bg:#1d140e;--sf:#2a1e15;--tx:#f3e8dc;--mu:#b9a593;--ac:#e0985f;--ac2:#3a2a1e;--bd:#4a3829;--ok:#6cc58d}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:0 auto;padding:env(safe-area-inset-top,0px) 14px calc(90px + env(safe-area-inset-bottom,0px))}
header{padding:16px 0 8px}h1{margin:0;font-size:22px;color:var(--ac)}.sub{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button,.chip{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 13px;border-radius:99px;font:inherit;white-space:nowrap;cursor:pointer}
nav button.on,.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.alt{background:var(--ac2);color:var(--tx)}
.mu{color:var(--mu);font-size:13px}.price{font-weight:600}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mu)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--bd)}
.bar>div{max-width:760px;margin:0 auto}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2)}
.note{font-size:12px;color:var(--mu);border-left:3px solid var(--ac);padding:4px 10px;margin:8px 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal-bg.open{display:flex}
.modal-box{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:16px;width:min(92vw,380px)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
</style>
</head>
<body>
<header><h1>☕ Kopi Remaja</h1><div class="sub">Prototipe V1 · menu digital &amp; pemesanan · Pengantar Bisnis Digital</div></header>
<nav id="nav"></nav>
<main id="app"></main>
<div class="bar" id="bar" hidden><div class="row"><div><b id="cn"></b><div class="mu" id="ct"></div></div><button class="btn" onclick="go('cart')">Lihat pesanan</button></div></div>
<div class="modal-bg" id="dlg" onclick="if(event.target===this)closeDlg()"><div class="modal-box" id="dlgBox"></div></div>
<script>
const rp=n=>"Rp"+n.toLocaleString("id-ID");
const SZ=[{l:"Reguler",p:0},{l:"Large",p:5000}],TP=["Panas","Dingin"];
// DATA CONTOH: sesuaikan harga & ketersediaan dengan papan menu asli.
const M=[
{id:1,n:"Kopi Susu",c:"Kopi",p:18000,s:SZ,t:TP},{id:2,n:"Americano",c:"Kopi",p:15000,s:SZ,t:TP},{id:3,n:"Espresso",c:"Kopi",p:12000,s:null,t:["Panas"]},
{id:4,n:"Matcha Latte",c:"Non-kopi",p:22000,s:SZ,t:TP},{id:5,n:"Teh Manis",c:"Non-kopi",p:8000,s:SZ,t:TP},{id:6,n:"Air Mineral",c:"Non-kopi",p:6000,s:null,t:null},
{id:7,n:"Shokyu Peach",c:"Minuman Remaja",p:32000,s:null,t:["Dingin"]},{id:8,n:"Shokyu Yuzu",c:"Minuman Remaja",p:32000,s:null,t:["Dingin"]},
{id:9,n:"Nasi Goreng Remaja",c:"Makanan",p:25000,s:null,t:null},{id:10,n:"Indomie Goreng",c:"Makanan",p:15000,s:null,t:null},{id:11,n:"Roti Bakar",c:"Makanan",p:18000,s:null,t:null},{id:12,n:"Dimsum",c:"Makanan",p:20000,s:null,t:null},
{id:13,n:"Sate Taichan",c:"Makanan",p:24000,s:[{l:"8 tusuk",p:0},{l:"100 tusuk",p:256000}],t:null},
{id:14,n:"Kentang Goreng",c:"Cemilan",p:15000,s:null,t:null},{id:15,n:"Sosis Goreng",c:"Cemilan",p:15000,s:null,t:null},
{id:16,n:"Mix Platter Remaja",c:"Paket",p:60000,s:null,t:null,orang:3},{id:17,n:"Paket Generasi Alfa",c:"Paket",p:150000,s:null,t:null,orang:6}
];
const CATS=["Semua",...new Set(M.map(m=>m.c))];
let cat="Semua",view="menu",cart=[],orders=[],seq=1,lastId=null;
const ST=["Baru","Diproses","Siap diambil","Selesai"];
const tabs=[["menu","Menu"],["cart","Pesanan"],["calc","Paket kelompok"],["status","Status"],["admin","Admin"]];
function go(v){view=v;render()}
function total(){return cart.reduce((a,c)=>a+c.price*c.qty,0)}
function closeDlg(){dlg.classList.remove("open")}
function render(){
 nav.innerHTML=tabs.map(([k,l])=>`<button class="${view==k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
 const q=cart.reduce((a,c)=>a+c.qty,0);bar.hidden=!(q&&view!="cart"&&view!="admin");cn.textContent=q+" item";ct.textContent=rp(total());
 app.innerHTML=({menu:vMenu,cart:vCart,calc:vCalc,status:vStatus,admin:vAdmin})[view]();
 if(view=="calc")calc();
}
function vMenu(){
 return `<div style="display:flex;gap:6px;overflow-x:auto;padding:4px 0">${CATS.map(c=>`<button class="chip ${c==cat?"on":""}" onclick="cat='${c}';render()">${c}</button>`).join("")}</div>
 <div class="note">Daftar menu dan harga di prototipe ini adalah data contoh (±17 dari sekitar 98 item).</div>
 ${M.filter(m=>cat=="Semua"||m.c==cat).map(m=>`<div class="card row"><div><b>${m.n}</b><div class="mu">${m.c}${m.s?" · ukuran: "+m.s.map(s=>s.l).join("/"):""}${m.t?" · "+m.t.join("/"):""}</div><div class="price">${m.s&&m.s[0].p==0&&m.s.length>1&&m.s[1].p>0?"mulai ":""}${rp(m.p)}</div></div><button class="btn" onclick="pick(${m.id})">Tambah</button></div>`).join("")}`;
}
function pick(id){
 const m=M.find(x=>x.id==id);
 if((!m.s&&!m.t)||(!m.s&&m.t.length==0)){add(m,0,"");return}
 dlgBox.innerHTML=`<b>${m.n}</b>${m.s?`<label>Ukuran</label><select id="os">${m.s.map((s,i)=>`<option value="${i}">${s.l}${s.p?" (+"+rp(s.p)+")":""}</option>`).join("")}</select>`:""}${m.t?`<label>Suhu</label><select id="ot">${m.t.map(t=>`<option>${t}</option>`).join("")}</select>`:""}
 <div class="row" style="margin-top:14px"><button class="btn alt" onclick="closeDlg()">Batal</button><button class="btn" onclick="addSel(${id})">Masukkan</button></div>`;
 dlg.classList.add("open");
}
function addSel(id){const m=M.find(x=>x.id==id);const si=m.s?+document.getElementById("os").value:0;const t=m.t?document.getElementById("ot").value:"";closeDlg();add(m,si,t)}
function add(m,si,t){
 const s=m.s?m.s[si]:null;const opt=[s&&s.l,t].filter(Boolean).join(", ");const key=m.id+"|"+opt;
 const f=cart.find(c=>c.key==key);if(f)f.qty++;else cart.push({key,name:m.n,opt,price:m.p+(s?s.p:0),qty:1});render();
}
function chg(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);render()}
function vCart(){
 if(!cart.length)return `<div class="card mu">Belum ada item. Pilih dari menu dulu.</div>`;
 return `${cart.map((c,i)=>`<div class="card row"><div><b>${c.name}</b><div class="mu">${c.opt||"–"} · ${rp(c.price)}</div></div><div><button class="chip" onclick="chg(${i},-1)">−</button> ${c.qty} <button class="chip" onclick="chg(${i},1)">+</button></div></div>`).join("")}
 <div class="card"><div class="row"><b>Total</b><b>${rp(total())}</b></div>
 <label>Nama pemesan</label><input id="nm" placeholder="Nama">
 <label>Jenis pesanan</label><select id="jp"><option>Makan di tempat (QR meja)</option><option>Ambil sendiri</option><option>Pre-order kelompok</option></select>
 <label>Nomor meja / jam ambil (opsional)</label><input id="mj">
 <label>Catatan</label><input id="cx" placeholder="mis. less sugar">
 <p class="mu">Hanya nama yang diminta; jangan isi data sensitif.</p>
 <button class="btn" style="width:100%" onclick="send()">Kirim pesanan</button></div>`;
}
function send(){
 const n=nm.value.trim();if(!n){alert("Isi nama pemesan dulu.");return}
 const o={id:seq++,nama:n,jenis:jp.value,mj:mj.value,cx:cx.value,items:cart.map(c=>({...c})),total:total(),st:0,t:new Date()};
 orders.unshift(o);lastId=o.id;cart=[];go("status");
}
function vStatus(){
 const o=orders.find(x=>x.id==lastId);
 if(!o)return `<div class="card mu">Belum ada pesanan. Kirim pesanan dari tab Pesanan untuk melihat statusnya.</div>`;
 return `<div class="card"><b>Pesanan #${o.id}</b> · ${o.nama}<div class="mu">${o.jenis}</div>
 <div style="margin:12px 0">${ST.map((s,i)=>`<span class="tag" style="${i<=o.st?"background:var(--ok);color:#fff":""}">${s}</span> `).join("")}</div>
 <div class="price">Status: ${ST[o.st]}</div><div class="mu">Status diperbarui oleh admin (lihat tab Admin).</div></div>
 <a class="btn" style="display:inline-block;text-decoration:none" href="https://wa.me/628000000000?text=Halo%20Kopi%20Remaja%2C%20pesanan%20%23${o.id}" target="_blank" rel="noopener">Hubungi via WhatsApp</a>
 <div class="note">Nomor WhatsApp masih contoh.</div>`;
}
function vCalc(){
 const ps=M.filter(m=>m.orang);
 return `<div class="card"><b>Kalkulator paket kelompok</b>
 <label>Jumlah orang</label><input id="jo" type="number" min="1" value="10" oninput="calc()">
 <label>Paket</label><select id="pk" onchange="calc()">${ps.map(p=>`<option value="${p.id}">${p.n} (${rp(p.p)}, cukup ±${p.orang} orang)</option>`).join("")}</select>
 <div id="cr" style="margin-top:12px"></div></div>
 <div class="note">Kapasitas orang per paket di sini adalah asumsi contoh. Papan menu asli belum mencantumkannya, jadi nilai ini perlu dikonfirmasi ke pemilik.</div>`;
}
function calc(){
 const p=M.find(x=>x.id==+pk.value),n=Math.max(1,+jo.value||1),q=Math.ceil(n/p.orang);
 cr.innerHTML=`<div>Perlu <b>${q}</b> × ${p.n}</div><div class="price">Total ${rp(q*p.p)} · ±${rp(Math.round(q*p.p/n))} per orang</div>
 <button class="btn" style="margin-top:8px" onclick="addQ(${p.id},${q})">Masukkan ke pesanan</button>`;
}
function addQ(id,q){const m=M.find(x=>x.id==id);for(let i=0;i<q;i++)add(m,0,"");go("cart")}
function vAdmin(){
 const sum={};orders.forEach(o=>o.items.forEach(i=>sum[i.name]=(sum[i.name]||0)+i.qty));
 const top=Object.entries(sum).sort((a,b)=>b[1]-a[1]).slice(0,3);
 return `<div class="card"><b>Ringkasan</b><div class="mu">${orders.length} pesanan · omzet contoh ${rp(orders.reduce((a,o)=>a+o.total,0))}</div>
 <div class="mu">Terlaris: ${top.length?top.map(t=>t[0]+" ("+t[1]+")").join(", "):"–"}</div></div>
 ${orders.length?orders.map(o=>`<div class="card"><div class="row"><b>#${o.id} ${o.nama}</b><span class="tag">${ST[o.st]}</span></div>
 <div class="mu">${o.jenis}${o.mj?" · "+o.mj:""} · ${o.t.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}</div>
 <div class="scroll"><table>${o.items.map(i=>`<tr><td>${i.qty}×</td><td>${i.name}</td><td>${i.opt}</td></tr>`).join("")}</table></div>
 ${o.cx?`<div class="mu">Catatan: ${o.cx}</div>`:""}<div class="row" style="margin-top:8px"><b>${rp(o.total)}</b>${o.st<3?`<button class="btn" onclick="nx(${o.id})">→ ${ST[o.st+1]}</button>`:`<span class="mu">Selesai</span>`}</div></div>`).join(""):`<div class="card mu">Belum ada pesanan masuk.</div>`}
 <div class="note">V1: pelanggan dan admin berada di satu halaman demo, data hilang saat halaman dimuat ulang. Penyimpanan bersama dijadwalkan di V2.</div>`;
}
function nx(id){const o=orders.find(x=>x.id==id);if(o&&o.st<3)o.st++;render()}
render();
</script>
</body>
</html>
